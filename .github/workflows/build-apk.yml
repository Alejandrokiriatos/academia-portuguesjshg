name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate offline game and synchronized assets
        run: |
          cmp index.html app/src/main/assets/index.html
          cmp memoria.html app/src/main/assets/memoria.html
          cmp juego.html app/src/main/assets/juego.html
          node <<'NODE'
          const fs = require('fs');
          for (const path of ['juego.html', 'app/src/main/assets/juego.html']) {
            const html = fs.readFileSync(path, 'utf8');
            const match = html.match(/<script>([\\s\\S]*?)<\\/script>/);
            if (!match) throw new Error('No script found in ' + path);
            new Function(match[1]);
            if (/https?:\\/\\//i.test(html)) throw new Error('External network dependency found in ' + path);
          }
          const portal = fs.readFileSync('index.html', 'utf8');
          for (const marker of ['memoryModule', 'gameModule', 'src="juego.html"']) {
            if (!portal.includes(marker)) throw new Error('Missing portal module: ' + marker);
          }
          console.log('Offline game syntax and web/Android assets validated.');
          NODE
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: academia-fala-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
