name: Request Unity Personal license file

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/unity-activation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-activation:
    name: Generate Unity activation request
    runs-on: ubuntu-latest
    steps:
      - name: Request Unity activation file
        id: activation
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2022.3.62f1

      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: Unity-2022.3.62f1-Activation-Request
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
          retention-days: 7
