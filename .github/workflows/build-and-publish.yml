name: Build and publish Rust Survival test builds

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rust-survival-test-build
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build WebGL, Android and Windows
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Unity license secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for key in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            value="${!key}"
            if [ -z "$value" ]; then
              echo "::error::Missing GitHub Actions secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Open Settings > Secrets and variables > Actions and add the three Unity Personal license secrets. Do not put them in source files."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build WebGL browser demo
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2022.3.62f1
          targetPlatform: WebGL
          buildMethod: RustSurvival.EditorTools.CIUnityBuild.Build
          manualExit: true
          allowDirtyBuild: true

      - name: Store WebGL build
        uses: actions/upload-artifact@v4
        with:
          name: RustSurvival-WebGL
          path: Builds/WebGL
          if-no-files-found: error
          retention-days: 14

      - name: Upload WebGL site
        uses: actions/upload-pages-artifact@v3
        with:
          path: Builds/WebGL

      - name: Publish browser demo to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2022.3.62f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: RustSurvival.EditorTools.CIUnityBuild.Build
          manualExit: true
          allowDirtyBuild: true

      - name: Store Android APK
        uses: actions/upload-artifact@v4
        with:
          name: RustSurvival-Android-APK
          path: Builds/Android/RustSurvival.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Windows game
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2022.3.62f1
          targetPlatform: StandaloneWindows64
          buildMethod: RustSurvival.EditorTools.CIUnityBuild.Build
          manualExit: true
          allowDirtyBuild: true

      - name: Store Windows game
        uses: actions/upload-artifact@v4
        with:
          name: RustSurvival-Windows
          path: Builds/Windows
          if-no-files-found: error
          retention-days: 14

      - name: Print browser play link
        if: success()
        run: |
          echo "WebGL demo: https://alejandrokiriatos.github.io/academia-portuguesjshg/"
