name: Build Rust Survival Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rust-survival-android-build
  cancel-in-progress: false

jobs:
  build-android:
    name: Compile Android test application
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Unity Personal license secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for key in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            value="${!key}"
            if [ -z "$value" ]; then
              echo "::error::Missing Actions secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the three Unity Personal secrets in Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi

      - name: Build Android APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2022.3.62f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: RustSurvival.EditorTools.CIUnityBuild.Build
          manualExit: true
          allowDirtyBuild: true

      - name: Verify APK output
        shell: bash
        run: |
          test -s Builds/Android/RustSurvival.apk
          echo "APK ready: $(du -h Builds/Android/RustSurvival.apk | cut -f1)"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustSurvival-Android-APK
          path: Builds/Android/RustSurvival.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-${{ github.run_number }}
          name: Rust Survival Android Test ${{ github.run_number }}
          body: |
            Android test build generated by GitHub Actions.
            Install the APK on an Android device and allow installation from this source when Android asks.
            This is an early prototype build, not a production release.
          files: Builds/Android/RustSurvival.apk
          draft: false
          prerelease: false
          make_latest: true
